# Nginx cho kolbooking — đặt tại /etc/nginx/sites-available/kolbooking
# rồi: ln -s /etc/nginx/sites-available/kolbooking /etc/nginx/sites-enabled/
#
# Server này ĐANG chạy sẵn một web khác, nên cấu hình mặc định dùng CỔNG RIÊNG
# (8080) thay vì chiếm cổng 80. Truy cập: http://34.126.124.249:8080
#
# Vì sao không dùng `server_name 34.126.124.249` trên cổng 80: nếu web đang có
# phục vụ qua IP (default_server), thêm một server block khớp đúng IP sẽ cướp
# mất lưu lượng của nó. Cổng riêng thì không đụng gì tới cấu hình sẵn có.
#
# Khi đã có tên miền, đổi thành: listen 80; server_name kolbooking.ten-mien.vn;
# rồi chạy certbot --nginx để lên HTTPS, và XÓA COOKIE_SECURE=false trong .env.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    # Bản build của client (Vite) — file tĩnh, không cần tiến trình Node riêng.
    root /var/www/kolbooking;
    index index.html;

    access_log /var/log/nginx/kolbooking.access.log;
    error_log  /var/log/nginx/kolbooking.error.log;

    # Upload ảnh portfolio/cover đi qua đây; 1MB body limit của API là cho JSON,
    # còn multipart cần rộng hơn.
    client_max_body_size 12M;

    # SPA: mọi đường dẫn không phải file thật đều trả index.html để React Router
    # tự định tuyến (/creators/crt_0001, /bookings/... đều là route phía client).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Tài sản có hash trong tên file → cache dài ngày là an toàn.
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Server đặt `trust proxy 1` nên rate limit đọc IP thật từ header này.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # File upload công khai do API phục vụ (avatar, ảnh portfolio).
    location /uploads/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
    }
}
